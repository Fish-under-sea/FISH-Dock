<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>section</title>
<style>
  /* 尺寸与配色全按仓库里原有的 section-*.png 量出来的：
     1432×83；上下 3px 描边、内侧 3px 高光 / 3px 内阴影、条体 64px、底部 7px 投影；
     tag 块固定 163px（含左边框），竖纹周期 10px、线宽 3px。 */
  @font-face { font-family: Jersey; src: url("Jersey20-Regular.ttf") format("truetype"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1432px; height: 83px; }
  .bar {
    width: 1432px; height: 76px;
    display: flex; align-items: stretch;
    border: 3px solid var(--edge);
    background: var(--body);
    box-shadow: inset 0 3px 0 var(--hi), inset 0 -3px 0 var(--lo), 0 7px 0 var(--shadow);
  }
  .tag {
    width: 160px; flex: none;
    display: grid; place-items: center;
    background: var(--tagbg); color: var(--tagfg);
    font: 400 30px/1 Jersey, monospace; letter-spacing: 1px;
  }
  .name {
    display: flex; align-items: center;
    padding: 0 20px 0 18px;
    color: var(--fg);
    font: 700 26px/1 "Microsoft YaHei", "Segoe UI", sans-serif; letter-spacing: 1px;
    white-space: nowrap;
  }
  .ticks {
    flex: 1; align-self: center; height: 44px;
    margin: 0 16px 0 6px;
    background: repeating-linear-gradient(90deg, var(--tick) 0 3px, transparent 3px 10px);
  }
  .dot { width: 15px; height: 15px; align-self: center; margin-right: 20px; background: var(--dot); }
  body.light {
    --edge: #5a544a; --hi: #f6f1e3; --lo: #bdb39c; --body: #ddd4bf; --shadow: #9c927b;
    --tagbg: #5a544a; --tagfg: #f6f3e9; --fg: #55503f; --tick: #a89e87; --dot: #7bd88f;
  }
  body.dark {
    --edge: #a69e87; --hi: #686957; --lo: #171a17; --body: #393930; --shadow: #111510;
    --tagbg: #a69e87; --tagfg: #23221c; --fg: #e8e2d2; --tick: #777b66; --dot: #7bd88f;
  }
</style>
</head>
<body class="light">
  <div class="bar">
    <span class="tag" id="tag">DEVELOP</span>
    <span class="name" id="name">插件开发</span>
    <span class="ticks"></span>
    <span class="dot"></span>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  document.body.className = q.get("theme") || "light";
  const tag = q.get("tag") || q.get("tab"), name = q.get("name") || q.get("title");
  if (tag) document.getElementById("tag").textContent = tag;
  if (name) document.getElementById("name").textContent = name;
</script>
</body>
</html>
