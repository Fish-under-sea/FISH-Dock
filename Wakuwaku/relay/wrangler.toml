# The crash relay as a Cloudflare Worker, its issues on GitHub (README.md).
name = "wakuwaku-crash"
main = "relay.js"
compatibility_date = "2026-09-01"

[vars]
FORGE = "github"
REPO = "zhoupengjie/Wakuwaku"
PER_IP_DAY = "20"
NEW_PER_DAY = "30"
COMMENTS = "10"

# Secrets (npx wrangler secret put <NAME>, never written here):
#   GITHUB_APP_ID, GITHUB_APP_KEY   (or GITHUB_TOKEN)
#   SALT

# The counts, and which issue each crash has. Made with
#   npx wrangler kv namespace create CRASH
# and its id put here.
[[kv_namespaces]]
binding = "CRASH"
id = "5bf3f46e0b6445769b9af1e5e248de85"

# Five reports a minute from one address (per Cloudflare location).
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
