name: 问题 / 需求（通用）
description: 提交前先查重、把类型标签与侧边栏填全；维护者还要挂 Milestone 版本
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **提交前五关**（缺一项维护者会打回）：
        1. **查重**：先搜标题关键词 / 现象 / 版本号，同问题的证据补到原 issue，不新开；
        2. **类型标签**：至少 1 个（`bug` / `performance` / `ui` / `accessibility` / `enhancement` / `documentation` / `question`）——**标签不表达版本**；
        3. **是否维护者**：必答；
        4. **版本**：用右侧栏 **Milestone** 表达（如 `2.1.2`），维护者必挂；非维护者写「非维护者」；
        5. **侧边栏六项**：Assignees / Labels / Projects / Milestone / Relationships / Development 提交后逐项补齐（见表单末尾的自查）。

        规则全文见 [CONTRIBUTING.md](../blob/main/.github/CONTRIBUTING.md)。插件业务问题提到 `Fish-under-sea/FISH-DOCK-Plugins`。

  - type: checkboxes
    id: duplicate-search
    attributes:
      label: 重复检查（必做）
      description: 提交前确实搜过；同问题的证据请补到原 issue，而不是新开一条。
      options:
        - label: 我已经在 Issues 里搜过标题关键词、现象与版本号，并确认这不是重复 issue
          required: true
        - label: 如果它与某条 issue 相关但不相同，我会在下面写清区别
          required: true

  - type: input
    id: duplicate-keywords
    attributes:
      label: 搜索关键词与排除的 issue
      description: 写清搜过什么词、看过后排除的 issue 编号（例：`内存 GPU 常驻`，排除 #29 #30）
      placeholder: 关键词：…；已排除：#…
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 类型（对应类型标签）
      description: 选完请真的把对应标签打上；拿不准选「question」，由维护者改。
      options:
        - bug（可复现的缺陷）
        - performance（内存 / GPU / 启动耗时）
        - ui（界面 / 视觉 / 交互）
        - accessibility（无障碍）
        - enhancement（新功能）
        - documentation（文档）
        - question（需要澄清）
        - crash（崩溃 / 卡死 / WebView 异常，请改用崩溃模板）
    validations:
      required: true

  - type: input
    id: labels-applied
    attributes:
      label: 标签自检
      description: 列出你实际打上的类型标签（版本不用标签，用右侧栏的 Milestone）。
      placeholder: bug, performance
    validations:
      required: true

  - type: dropdown
    id: maintainer
    attributes:
      label: 是否为维护者
      description: 维护者指对本仓有写权限的人；答「是」就必须填下一项预修复版本。
      options:
        - 否
        - 是
    validations:
      required: true

  - type: input
    id: fix-version
    attributes:
      label: 预修复版本（维护者必填）
      description: 与右侧栏 **Milestone** 同一个号（版本用 Milestone 表达，不用标签），形如 `2.1.2`；定不下来写「待定」。非维护者写「非维护者」。
      placeholder: 2.1.2
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 一句话说清发生了什么；有数字就给数字，没测的写「未测」，不估算。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动到出问题的每一步；能贴截图/日志的直接贴。
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 你认为正确的行为；若是视觉问题，写清「对齐 / 间距 / 颜色」哪一项不对。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 版本号、系统与缩放、日志片段、截图、CSV 路径。**不要贴令牌、凭据、私钥或他人隐私。**
    validations:
      required: true

  - type: checkboxes
    id: ack
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在正文里留下令牌、凭据、私钥或他人隐私；崩溃报告已用「导出报告」（本机脱敏）生成
          required: true

  - type: checkboxes
    id: sidebar
    attributes:
      label: 侧边栏自查（提交后把右侧栏这六项补齐；表单填不了它们）
      description: 提完就在 issue 右侧栏逐项设置；不是维护者时由维护者分诊时补齐。
      options:
        - label: Assignees —— 已挂负责人（维护者自开的挂自己，不留 No one）
          required: true
        - label: Labels —— 已打 ≥1 个类型标签
          required: true
        - label: Projects —— 本仓未启用，已在正文写「无」
          required: true
        - label: Milestone —— 已挂版本位（如 2.1.2），与「预修复版本」同号
          required: true
        - label: Relationships —— 已写明关联/依赖/并入的 issue 编号
          required: true
        - label: Development —— 开工后挂分支或 PR；未开工写「未开工」
          required: true